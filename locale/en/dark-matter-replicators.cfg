[mod-setting-description]
tenemut-near-spawn=If tenemut ore generates near spawn
tenemut-spawning-planet=Which planet tenemut will spawn on
tenemut-other-planets=Spawn tenemut on other planets too, with or without Nauvis
replstats-speed-base=The crafting speed of a tier 1 replicator. Higher tiers multiply this by the speed factor.
replstats-speed-factor=This is multiplied with each tier increase, resulting in geometric growth.  Note that changing the time per item while not changing the energy per time will change the energy per item.
replstats-energy-base=The energy consumption (kW) of a tier 1 replicator. Higher tiers multiply this by the energy factor.
replstats-energy-factor=This is multiplied with each tier increase, resulting in geometric growth.
replstats-pollution-base=The pollution per second of a tier 1 replicator. Higher tiers multiply this by the pollution factor.
replstats-pollution-factor=This is multiplied with each tier increase, resulting in geometric growth.
replstats-size-base=This value is rounded down to an integer after addition is performed.  If the resulting size would be negative then a size of 1 is used instead.
replstats-size-addend=This is added with each tier increase, resulting in linear growth (or shrinkage, if you think technology should become smaller as it gets more advanced).
replstats-modules-base=This value is rounded down to an integer after addition is performed.  This is how the default numbers of module slots are 1, 1, 2, 2 and 3.  If the resulting number of module slots would be negative then the replicator has no module slots instead.
replstats-modules-addend=This is added with each tier increase, resulting in linear growth.

replresearch-item-multiplier=The base research repetition count multiplier for replicating a new item. Multiplied by the replication tier; the research difficulty setting scales it further.
replresearch-item-time=The amount of time that it takes a replication research lab to perform one rep of research.
replresearch-space-lock=The first replicator tier whose research requires space science packs. Set to 6 to keep ALL replicators planet-side (there is no tier 6, so this effectively disables the space lock).

replication-penalty=This multiplier is applied to the final cost of every replication recipe (cost × (1 + penalty)). It prevents replicating large numbers of cheap items such as ores or plates from being overpowered.
replication-fluid-quantity=This is the amount of fluid created every time a fluid is replicated.  The time per unit of fluid remains the same.

replication-in-space=Allow Replicators in space (Space Age or Space Exploration)
dmrsa-tech-distribution=Choose how replication recipes are unlocked: 'Mirror' (default) creates one replication tech per ORIGINAL game technology — you unlock "Replication: <tech>" by researching that tech (and its tier's raw materials). 'Individual' (legacy) creates one tech node per item, as in v3.x.
dmrsa-require-original-tech=When enabled, replicating an item requires first researching its original unlock technology (you cannot replicate what you cannot craft). Disable to allow replication from the tier machine alone.
dmrsa-grouped-tech-cost-multiplier=The multiplier applied to the research cost of grouped category technologies. Automatically raised to 15.0 when overhaul mods (Bob's, Angel's, Krastorio 2) are detected — override here if you want a different value.
dmrsa-cost-calculation-method=Determines how recipe costs are calculated. flat applies penalty at the end once, while compounding applies the penalty at every crafting step (making complex items cost exponentially more).
dmrsa-use-machine-efficiency=When enabled, replication costs are adjusted based on the original recipe's machine type. Smelting in an electric furnace costs less to replicate than oil processing in a refinery. Enabled by default for production-style balance.
dmrsa-log-level=Controls verbosity of [DarkMatterReplicators] log messages. 'warn' (default) shows only warnings and errors; 'info' adds informational messages like pass summaries; 'debug' shows per-item cost-solver traces; 'none' silences all mod output.
dmrsa-research-difficulty=Scales research cost (count), research time, AND the max replication recipe crafting time for ALL replication technologies. Easy (Fast) is the default: 25 count / 5s time / 600s cap (your replresearch-* settings). Medium: 50 count / 15s time / 1000s cap. High: 100 count / 30s time / 1800s cap. Very Hard: 200 count / 45s time / 3200s cap.
dmrsa-research-pack-order=Order of research pack ingredients in replication technologies' tech tree. 'DMR Item First' (default) shows the custom DMR intermediate (tenemut/scoop/transducer/conduit) before the vanilla/SA science packs. 'Science Pack First' shows the science packs first. Cosmetic — research cost is unchanged.


