[technology-description]
dmrsa-replication-1=The first whisper from the void. Unlocks the Simple Replicator, the Dark Matter Scoop, and Tenemut Utilization — the foundations of replication, where raw matter first learns to rebuild itself.
dmrsa-replication-2=Matter begins to obey. Unlocks the Element Replicator, the Dark Matter Transducer, and the Matter Conduit — giving replication shape, intent, and the precision to build the world atom by atom.
dmrsa-replication-3=Chemistry becomes reproducible. Unlocks the Chemical Replicator for chemicals, alloys, and fluids. In Space Age this tier is available BEFORE the planets: tier 3 research uses chemical science packs only, and the planetary replication technologies build on top of it.
dmrsa-replication-4=Devices begin to replicate themselves. Unlocks the Device Replicator for complex machines (advanced circuits, processing units, Space Age components). Requires visiting Vulcanus, Fulgora, and Gleba in Space Age.
dmrsa-replication-5=Nothing is beyond reach. Unlocks the Advanced Replicator, the highest tier — alien artifacts, exotic matter, and science packs themselves become reproducible. Requires cryogenic science in Space Age.
dmrsa-replication-vulcanus=The forge speaks. Unlock the Geothermal Replicator on Vulcanus to synthesize metallic ores and advanced alloys with geothermal efficiency.
dmrsa-replication-fulgora=The storm teaches. Unlock the Electromagnetic Replicator on Fulgora to synthesize holmium components and advanced circuits using lightning-charged grid speeds.
