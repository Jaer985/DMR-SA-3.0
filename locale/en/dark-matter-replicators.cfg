[item-description]
dmrsa-tenemut=A crystalline mineral that resonates with dark matter when charged. Discovered on a remote world, it is the only known substance that can touch the void between atoms. Mined from tenemut clusters and consumed as the fuel of every replicator.
dmrsa-dark-matter-scoop=The first machine to touch the void. It channels tenemut's resonance to pull dark matter into stable form — but the result is crude: loose ores and fluids, without shape or structure. Enough to copy raw materials, nothing more.
dmrsa-dark-matter-transducer=Where the scoop drags matter into existence, the transducer gives it intent. By imposing atomic structure on the discharge, it transforms raw material into pure elements and solid forms — the first true act of creation.
dmrsa-matter-conduit=Replication demanded more than matter: it demanded meaning. The conduit guides dark matter at the nanometer scale, assembling components too small for human hands — circuits, processors, the invisible bones of technology.
dmrsa-dark-matter=The universal substrate of replication. Every replicated object is dark matter given form — stabilized, shaped, and made real. The ghost substance that became the foundation of industry.
dmrsa-replicator-vulcanus=Locked to Vulcanus. Tuned to the planet's geothermal heart — replicates metallurgical ores, calcite, and molten metals at 3x speed with high energy savings.
dmrsa-replicator-fulgora=Locked to Fulgora. Born from the planet's electromagnetic storms — replicates advanced electronics and superconducting components at 3x speed.
dmrsa-replicator-gleba=Locked to Gleba. The only machine capable of biological replication — outputs organic products at 100% freshness and 3x speed.
dmrsa-replicator-aquilo=Locked to Aquilo. Master of absolute cold — replicates cryo-refined elements and lithium components at an extreme 5x speed utilizing superconductive cooling.

# Item descriptions for replicator machines (mirrored from entity-description
# so the in-hand / cursor description resolves correctly).
dmrsa-replicator-1=Tier 1 replicator. The first machine to give shape to nothingness — converts tenemut-charged dark matter into loose materials (ores, fluids, basic plates). Crude output, but it is where replication begins.
dmrsa-replicator-2=Tier 2 replicator. Adds atomic shaping to the replication process — can form solid shapes and replicate pure elements with structural fidelity. Higher energy cost per craft than tier 1.
dmrsa-replicator-3=Tier 3 replicator. Extends replication to the molecular realm — chemical substances, alloys, and fluids. Unlocked before the planets with chemical science packs; planetary replicators handle planet-specific recipes.
dmrsa-replicator-4=Tier 4 replicator. Achieves machine-grade precision — replicates complex devices (advanced circuits, processing units, most Space Age components) with nanometer-scale fidelity.
dmrsa-replicator-5=Tier 5 replicator. The peak of replication — copies anything the mod considers replicable, including alien artifacts, exotic matter, and science packs themselves.

