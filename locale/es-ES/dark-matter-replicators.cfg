[item-description]
dmrsa-dark-matter-scoop=La primera máquina en tocar el vacío. Canaliza la resonancia del tenemut para atraer materia oscura a una forma estable — pero el resultado es crudo: minerales y fluidos sueltos, sin forma ni estructura. Suficiente para copiar materias primas, nada más.
dmrsa-dark-matter-transducer=Si el recolector arrastra la materia a la existencia, el transductor le da intención. Al imponer estructura atómica a la descarga, transforma material bruto en elementos puros y formas sólidas — el primer acto real de creación.
dmrsa-matter-conduit=La replicación exigía más que materia: exigía significado. El conducto guía la materia oscura a escala nanométrica, ensamblando componentes demasiado pequeños para manos humanas — circuitos, procesadores, los huesos invisibles de la tecnología.
dmrsa-dark-matter=El sustrato universal de la replicación. Cada objeto replicado es materia oscura con forma — estabilizada, moldeada, hecha real. La sustancia fantasma que se convirtió en los cimientos de la industria.
dmrsa-tenemut=Un mineral cristalino que resuena con la materia oscura al ser cargado. Descubierto en un mundo remoto, es la única sustancia conocida capaz de tocar el vacío entre átomos. Se extrae de las agrupaciones de tenemut y alimenta cada replicador.
dmrsa-replicator-vulcanus=Exclusivo de Vulcanus. Sintonizado con el corazón geotérmico del planeta — replica minerales metalúrgicos, calcita y metales fundidos a 3x de velocidad con alto ahorro energético.
dmrsa-replicator-fulgora=Exclusivo de Fulgora. Nacido de las tormentas electromagnéticas del planeta — replica electrónica avanzada y componentes superconductores a 3x de velocidad.
dmrsa-replicator-gleba=Exclusivo de Gleba. La única máquina capaz de replicación biológica — produce productos orgánicos con 100% de frescura y 3x de velocidad.
dmrsa-replicator-aquilo=Exclusivo de Aquilo. Maestro del frío absoluto — replica elementos crio-refinados y componentes de litio a una velocidad extrema de 5x utilizando enfriamiento superconductivo.


# Descripciones de items para los replicadores (reflejadas desde entity-description
# para que la descripción en mano/cursor se resuelva correctamente).
dmrsa-replicator-1=Replicador de nivel 1. La primera máquina en dar forma a la nada — convierte materia oscura cargada de tenemut en materiales sueltos (minerales, fluidos, placas básicas). Salida cruda, pero aquí comienza la replicación.
dmrsa-replicator-2=Replicador de nivel 2. Añade modelado atómico al proceso — puede formar formas sólidas y replicar elementos puros con fidelidad estructural. Mayor coste de energía por fabricación que el nivel 1.
dmrsa-replicator-3=Replicador de nivel 3. Extiende la replicación al reino molecular — sustancias químicas, aleaciones y fluidos. Se desbloquea antes de los planetas con packs de ciencia química; los replicadores planetarios manejan las recetas específicas de cada planeta.
dmrsa-replicator-4=Replicador de nivel 4. Alcanza precisión de grado industrial — replica dispositivos complejos (circuitos avanzados, unidades de procesamiento, la mayoría de componentes de Space Age) con fidelidad nanométrica.
dmrsa-replicator-5=Replicador de nivel 5. La cúspide de la replicación — copia cualquier cosa que el mod considere replicable, incluyendo artefactos alienígenas, materia exótica y los propios packs de ciencia.

[entity-description]
dmrsa-tenemut=Una agrupación de cristales de tenemut incrustados en piedra. Cada agrupación puede minarse para extraer tenemut, el combustible base para todas las recetas de replicación.

dmrsa-replication-lab=Una instalación de investigación que decodifica los patrones de la materia misma. Consume tenemut y packs de ciencia para traducir la realidad en recetas replicables — necesaria para desbloquear cada nivel de replicador.

dmrsa-replicator-1=Replicador de nivel 1. La primera máquina en dar forma a la nada — convierte materia oscura cargada de tenemut en materiales sueltos (minerales, fluidos, placas básicas). Salida cruda, pero aquí comienza la replicación.
