[mod-setting-description]
tenemut-near-spawn=Si el mineral de tenemut se genera cerca del spawn
tenemut-spawning-planet=En qué planeta aparecerá el tenemut
tenemut-other-planets=Generar tenemut en otros planetas también, con o sin Nauvis
replstats-speed-base=La velocidad de fabricación de un replicador de nivel 1. Los niveles superiores multiplican esto por el factor de velocidad.
replstats-speed-factor=Se multiplica con cada aumento de nivel, resultando en crecimiento geométrico. Ten en cuenta que cambiar el tiempo por objeto sin cambiar la energía por tiempo cambiará la energía por objeto.
replstats-energy-base=El consumo de energía (kW) de un replicador de nivel 1. Los niveles superiores multiplican esto por el factor de energía.
replstats-energy-factor=Se multiplica con cada aumento de nivel, resultando en crecimiento geométrico.
replstats-pollution-base=La contaminación por segundo de un replicador de nivel 1. Los niveles superiores multiplican esto por el factor de contaminación.
replstats-pollution-factor=Se multiplica con cada aumento de nivel, resultando en crecimiento geométrico.
replstats-size-base=Este valor se redondea hacia abajo a un entero después de realizar la suma. Si el tamaño resultante fuera negativo, se usará un tamaño de 1 en su lugar.
replstats-size-addend=Se suma con cada aumento de nivel, resultando en crecimiento lineal (o reducción, si crees que la tecnología debería hacerse más pequeña al avanzar).
replstats-modules-base=Este valor se redondea hacia abajo a un entero después de realizar la suma. Así es como los números predeterminados de ranuras de módulo son 1, 1, 2, 2 y 3. Si el número resultante de ranuras fuera negativo, el replicador no tendrá ranuras de módulo.
replstats-modules-addend=Se suma con cada aumento de nivel, resultando en crecimiento lineal.

replresearch-item-multiplier=El multiplicador base del número de repeticiones de investigación para replicar un objeto nuevo. Se multiplica por el nivel de replicación; el ajuste de dificultad de investigación lo escala aún más.
replresearch-item-time=La cantidad de tiempo que tarda un laboratorio de replicación en realizar una repetición de investigación.
replresearch-space-lock=El primer nivel de replicador cuya investigación requiere packs de ciencia espacial. Establécelo en 6 para mantener TODOS los replicadores en los planetas (no existe nivel 6, así que esto desactiva el bloqueo espacial).

replication-penalty=Este multiplicador se aplica al coste final de cada receta de replicación (coste × (1 + penalización)). Evita que replicar grandes cantidades de objetos baratos como minerales o placas sea demasiado poderoso.
replication-fluid-quantity=Esta es la cantidad de fluido creado cada vez que se replica un fluido. El tiempo por unidad de fluido sigue siendo el mismo.

replication-in-space=Permitir replicadores en el espacio (Space Age o Space Exploration)
dmrsa-tech-distribution=Elige cómo se desbloquean las recetas de replicación: 'Tecnologías individuales' crea un nodo tecnológico por objeto; 'Tecnologías del juego base' vincula los desbloqueos de recetas a las tecnologías estándar; 'Categorías agrupadas' desbloquea categorías de objetos juntos mediante tecnologías de alto coste con límite de tiempo.
dmrsa-grouped-tech-cost-multiplier=El multiplicador aplicado al coste de investigación de las tecnologías de categorías agrupadas. Se eleva automáticamente a 15.0 cuando se detectan mods de overhaul (Bob's, Angel's, Krastorio 2) — cámbialo aquí si quieres otro valor.
dmrsa-cost-calculation-method=Determina cómo se calculan los costes de las recetas. 'flat' aplica la penalización al final una sola vez, mientras que 'compounding' aplica la penalización en cada paso de fabricación (haciendo que los objetos complejos cuesten exponencialmente más).
dmrsa-use-machine-efficiency=Cuando está activado, los costes de replicación se ajustan según el tipo de máquina de la receta original. Fundir en un horno eléctrico cuesta menos de replicar que procesar petróleo en una refinería. Activado por defecto para un balance orientado a producción.
dmrsa-log-level=Controla la verbosidad de los mensajes de registro de [DarkMatterReplicators]. 'warn' (por defecto) muestra solo advertencias y errores; 'info' añade mensajes informativos como resúmenes de pasadas; 'debug' muestra trazas del cost-solver por item; 'none' silencia toda la salida del mod.
dmrsa-research-difficulty=Escala el coste (cantidad), el tiempo de investigación Y el tiempo máximo de fabricación de las recetas de replicación para TODAS las tecnologías de replicación. Fácil (Rápida) es el valor por defecto: 25 de coste / 5s de tiempo / límite 600s (tus ajustes replresearch-*). Media: 50 de coste / 15s de tiempo / límite 1000s. Alta: 100 de coste / 30s de tiempo / límite 1800s. Muy difícil: 200 de coste / 45s de tiempo / límite 3200s.
dmrsa-research-pack-order=Orden de los ingredientes de investigación en el árbol de tecnologías de replicación. 'Elemento DMR primero' (por defecto) muestra el intermediario DMR personalizado (tenemut/scoop/transductor/conducto) antes que los packs de ciencia vanilla/SA. 'Pack de ciencia primero' muestra los packs primero. Cosmético — el coste de investigación no cambia.


